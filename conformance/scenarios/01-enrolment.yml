---
name: 01-enrolment
description: Device enrolment and whoami. This server has no self-service login -- the
  bootstrap device token is minted out-of-band by an operator running `tinkerex-sync
  device issue` (the Rails host's `sync:device:issue` when this was recorded), the same
  shape as any other server credential, and every request below authenticates with it. First whoami confirms
  that bootstrap credential's identity; then POST /v1/devices uses that same credential
  to enrol a second, sibling device for the same user -- the mechanism the rest of
  this corpus relies on for proof that device-token auth works exactly as recorded
  here.
steps:
- name: whoami confirms the bootstrap device's identity
  request:
    method: GET
    path: "/v1/devices/whoami"
  expect:
    status: 200
    body:
      device_id:
        "$type": integer
      head_seq: 0
      user_id:
        "$type": integer
- name: enrol a second device from the bootstrap credential
  request:
    method: POST
    path: "/v1/devices"
    body:
      name: conformance-second-device
  expect:
    status: 201
    body:
      device_id:
        "$type": integer
      device_token:
        "$type": string
