# The sync server's gates: the Rust binary (crates/tinkerex-sync) and the conformance corpus that
# grades it over HTTP. Phase 6 of docs/superpowers/plans/2026-09-30-rust-rewrite.md removed the two
# Ruby jobs -- the engine's suite on test/dummy (plus the host's), and the corpus against the Rails
# host -- with the Ruby itself; `conformance` below is what was `conformance-rust`.
#
# SELF-HOSTED RUNNERS ONLY, NEVER `*-latest`. GitHub bills only hosted runners (macos 10x,
# windows 2x); self-hosted are free. This is the monorepo's standing rule and it travels with the
# code. The runner is a Mac registered by ci/runners/setup-macos.sh (`charless-MBP-maker-mac`).
# A job that matches no ONLINE runner does not fail -- it sits for 24h at 0 elapsed and is
# auto-cancelled, which reads as UNSTABLE rather than red -- so verify the runner rather than trust
# this comment: `gh api repos/chaim354/tinkerex-sync/actions/runners` (it needs an admin-scoped
# token and 403s from inside Actions).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # THE RUST SERVER. The runner already carries rustup (it builds chaim354/tinkerex-client), and
  # rust-toolchain.toml pins the version every cargo call here uses; nothing is installed beyond
  # cargo-deny, idempotently, because the box is persistent.
  rust-check:
    runs-on: [ self-hosted, macos ]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain present
        run: rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy, warnings are errors
        run: cargo clippy --all-targets -- -D warnings

      # PERMISSIVE LICENCES ONLY (CLAUDE.md §1), as a gate rather than a rule: deny.toml allows
      # MIT/Apache/BSD/ISC/Zlib/Unicode and refuses the rest. Mutation-checked on 2026-09-30 with a
      # GPL path crate (red), so an allow-list typo that lets everything through would show here.
      - name: Licences and sources (cargo-deny)
        run: |
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
          cargo deny check licenses sources

      # Unit + integration tests on SQLite. The Postgres leg of tests/concurrency.rs runs only with
      # TEST_DATABASE_URL and PRINTS that it did not run otherwise; this runner has no Postgres, so
      # that leg is a documented manual gate until one exists (plan §6) -- do not read this step's
      # green as covering it.
      - name: Tests
        run: cargo test

  # THE CORPUS AGAINST THE BINARY: the sixteen scenario files, graded by the Ruby verifier from
  # outside the server's own language (conformance/README.md, "Why this corpus exists").
  conformance:
    runs-on: [ self-hosted, macos ]
    steps:
      - uses: actions/checkout@v7

      # No ruby/setup-ruby: it assumes a hosted /Users/runner layout the self-hosted box lacks.
      # The runner's PATH carries a mise ruby.
      - name: Install gems
        run: bundle install --quiet

      # THE TOOLING'S OWN TESTS: the matcher (conformance/runner.rb -- the corpus's teeth, shared by
      # the verifier and bin/conformance-record) and bin/build-and-push's tagging. There is no server
      # in this step, so test/conformance_test.rb's sixteen scenario tests SKIP here, by design: the
      # next steps run them against the binary and fail on any skip.
      - name: Tooling tests (no server -- the scenarios skip here)
        run: bundle exec rake test

      # SELF-HOSTED RUNNERS ARE PERSISTENT: a previous run's server can still be listening if that
      # job was cancelled, or crashed, before its own stop step ran.
      - name: Kill a stale listener on 3004
        run: |
          if [ -n "$(lsof -ti tcp:3004 || true)" ]; then
            echo "port 3004 already in use -- killing stale listener(s)"
            lsof -ti tcp:3004 | xargs -r kill -9 || true
            sleep 1
          fi

      # bin/conformance builds the binary and boots it on a FRESH database every run (a temp
      # directory), which is how CI guarantees what 11-admin.yml and 14-tenancy.yml need: their
      # fixed, checked-in emails must never have been used, and a reused database answers 409 the
      # second time. It issues a fresh device (01-enrolment.yml pins head_seq 0), sets
      # STORAGE_BACKEND=local and SYNC_ADMIN_TOKEN=conformance-corpus-admin-token -- a fixed test
      # fixture 11-admin.yml sends, not a secret: it authenticates nothing but this 127.0.0.1
      # server -- waits on /up, runs the verifier, and parses the verifier's own summary line,
      # failing on a nonzero skip count or zero runs: the two false greens nothing inside a
      # Minitest suite can see about itself.
      - name: Build, boot, verify
        run: SYNC_PORT=3004 bin/conformance

      - name: Stop the server
        if: always()
        run: lsof -ti tcp:3004 | xargs -r kill || true
