# ACTION CABLE IS A HOST OBLIGATION, AND THE ENGINE CANNOT DEFAULT IT.
#
# Sync::LibraryChannel.broadcast_change fires on every commit, mutation and restore -- it is how
# devices learn there is something to pull. With no adapter configured, ActionCable's config is nil
# and the broadcast raises `undefined method 'fetch' for nil` from inside the commit, naming nothing
# useful. That is exactly how this file came to exist: the standalone host crashed on finalize and
# the message pointed at neither cable nor configuration.
#
# The engine defaults `config.x.verify_finalize` for itself (see lib/tinkerex_sync/engine.rb) because
# that is ITS setting with a sensible answer. An adapter choice is not: async is wrong for more than
# one process, redis needs a server, solid_cable needs a database. A host must choose, so the engine
# declares the obligation instead of guessing at it.
development:
  adapter: async

test:
  adapter: test

production:
  # `async` is IN-PROCESS ONLY: a second web container's devices would never hear a broadcast made
  # by the first, and nothing would report it -- they would simply stay stale until their next poll.
  # Set CABLE_ADAPTER=redis (with REDIS_URL) or solid_cable for any deployment running more than one
  # process, which is every real one.
  adapter: <%= ENV.fetch("CABLE_ADAPTER", "async") %>
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: tinkerex_sync
