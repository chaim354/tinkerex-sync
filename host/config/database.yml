# SQLite only -- this dummy app has no `production` environment to prove Postgres compatibility
# for (that is the HOST's job; the engine's models are the same adapter-agnostic AR code either
# way, and CLAUDE.md §14e's Postgres-specific concerns -- the pooler check, the FOR UPDATE lock --
# are exercised by config/services/sync/concurrent_seq_test.rb against whichever adapter this
# file names, same as the host's own copy of that test).
#
# `timeout: 15000` mirrors the host's config/database.yml verbatim -- CLAUDE.md §12.7/§14e: this
# is the fix for a measured SQLite fsync stall under concurrent writers, not a per-app tuning
# knob, and test/services/sync/concurrent_seq_test.rb (moved into this suite) hammers exactly the
# lock this protects.
default: &default
  adapter: sqlite3
  timeout: 15000

test:
  <<: *default
  database: storage/test.sqlite3
