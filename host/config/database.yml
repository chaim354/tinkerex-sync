# THE STANDALONE HOST'S DATABASE. Inherited from test/dummy, which defined `test` and nothing else --
# so the app shipped unable to run in the one mode an operator actually uses. Found by trying to
# start it, which is the only thing that could have found it: every suite runs in `test`.
default: &default
  adapter: sqlite3
  timeout: 15000          # a stalled fsync, not bad lock logic -- see the tinkerex CLAUDE.md §14e
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# SQLITE IS THE SELF-HOST DEFAULT AND POSTGRES THE MANAGED ONE, same as the maker app: the models
# are adapter-agnostic. DATABASE_URL wins when set, which is how a container points at Postgres
# without this file changing.
production:
  <<: *default
  database: <%= ENV.fetch("SQLITE_DATABASE", "storage/production.sqlite3") %>
  url: <%= ENV["DATABASE_URL"] %>
