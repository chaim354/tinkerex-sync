# cargo-deny: the licence rule CLAUDE.md §1 states, made a gate. Permissive only.
# Mutation-checked when introduced: adding a GPL crate to a scratch branch turns `cargo deny check`
# red (plan §4 task 1.1).
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
