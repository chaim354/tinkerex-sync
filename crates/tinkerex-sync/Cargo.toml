[package]
name = "tinkerex-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The tinkerex sync server: chunk, version and changelog engine behind the v1 API"
publish = false

[dependencies]
anyhow = "1.0.104"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1.150.0", features = ["behavior-version-latest"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "chrono", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "util", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
