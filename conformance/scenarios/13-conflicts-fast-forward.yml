---
name: 13-conflicts-fast-forward
description: 'The two edges of the conflict rule that 07-conflicts.yml does not reach.
  First the SAME-DEVICE EXCEPTION: device A commits v1, then v2 based on v1, then
  v3 based on v1 again -- a stale base, but the version it is stale against is A''s
  own, so this is a plain fast-forward put with no conflict row (the client that wrote
  both knows what it did). Then the exception''s limit: after a restore to v1 through
  POST /v1/nodes/:id/restore, the node''s current version is the RESTORED one, which
  carries no device at all -- so a commit from device A based on v3 (current until
  a moment ago) IS a conflict, recorded and listed, and resolved here with split passed
  as the string "1" rather than a JSON true, pinning that the flag is read the way
  Rails casts a boolean param. The final search asks for the exact original name only,
  because the split sibling''s name carries the incoming version''s timestamp and
  would not replay.'
steps:
- name: begin ff-note.txt v1, device A
  request:
    method: POST
    path: "/v1/commit"
    body:
      commit_id: 00000000-0000-4000-8000-00000000d002
      node_id: 00000000-0000-4000-8000-00000000d001
      parent_node_id:
      name: ff-note.txt
      base_version_id:
      size: 5
      manifest:
      - hash: f72e3e8316f0ec210b26be3853cfd5b89a763977763263cdcda26b41f3b499be
        offset: 0
        length: 5
  expect:
    status: 200
    body:
      commit_id: 00000000-0000-4000-8000-00000000d002
      missing:
      - f72e3e8316f0ec210b26be3853cfd5b89a763977763263cdcda26b41f3b499be
      put_urls:
        f72e3e8316f0ec210b26be3853cfd5b89a763977763263cdcda26b41f3b499be:
          "$capture": ff_v1_put_url
- name: upload v1's bytes
  request:
    method: PUT
    path: "{{ff_v1_put_url}}"
    body: ff v1
  expect:
    status: 200
- name: finalize v1
  request:
    method: POST
    path: "/v1/commit/00000000-0000-4000-8000-00000000d002/finalize"
  expect:
    status: 200
    body:
      seq:
        "$type": integer
      version_id:
        "$capture": ff_v1_version_id
- name: begin v2 based on v1, device A -- a clean fast-forward
  request:
    method: POST
    path: "/v1/commit"
    body:
      commit_id: 00000000-0000-4000-8000-00000000d003
      node_id: 00000000-0000-4000-8000-00000000d001
      parent_node_id:
      name: ff-note.txt
      base_version_id: "{{ff_v1_version_id}}"
      size: 5
      manifest:
      - hash: b981a63464a72e68a5f073aef5c002294f3a5379941497fbba36bcab93205391
        offset: 0
        length: 5
  expect:
    status: 200
    body:
      commit_id: 00000000-0000-4000-8000-00000000d003
      missing:
      - b981a63464a72e68a5f073aef5c002294f3a5379941497fbba36bcab93205391
      put_urls:
        b981a63464a72e68a5f073aef5c002294f3a5379941497fbba36bcab93205391:
          "$capture": ff_v2_put_url
- name: upload v2's bytes
  request:
    method: PUT
    path: "{{ff_v2_put_url}}"
    body: ff v2
  expect:
    status: 200
- name: finalize v2
  request:
    method: POST
    path: "/v1/commit/00000000-0000-4000-8000-00000000d003/finalize"
  expect:
    status: 200
    body:
      seq:
        "$type": integer
      version_id:
        "$capture": ff_v2_version_id
- name: begin v3 based on v1 AGAIN -- stale, but current is device A's own v2, so
    no conflict
  request:
    method: POST
    path: "/v1/commit"
    body:
      commit_id: 00000000-0000-4000-8000-00000000d004
      node_id: 00000000-0000-4000-8000-00000000d001
      parent_node_id:
      name: ff-note.txt
      base_version_id: "{{ff_v1_version_id}}"
      size: 5
      manifest:
      - hash: fc59beb8d31a1e165db7665f5b225521e74d70cf8a0accd5a104eabc1f165511
        offset: 0
        length: 5
  expect:
    status: 200
    body:
      commit_id: 00000000-0000-4000-8000-00000000d004
      missing:
      - fc59beb8d31a1e165db7665f5b225521e74d70cf8a0accd5a104eabc1f165511
      put_urls:
        fc59beb8d31a1e165db7665f5b225521e74d70cf8a0accd5a104eabc1f165511:
          "$capture": ff_v3_put_url
- name: upload v3's bytes
  request:
    method: PUT
    path: "{{ff_v3_put_url}}"
    body: ff v3
  expect:
    status: 200
- name: finalize v3 -- the same-device fast-forward
  request:
    method: POST
    path: "/v1/commit/00000000-0000-4000-8000-00000000d004/finalize"
  expect:
    status: 200
    body:
      seq:
        "$type": integer
      version_id:
        "$capture": ff_v3_version_id
- name: no conflict was recorded
  request:
    method: GET
    path: "/v1/conflicts"
  expect:
    status: 200
    body:
      conflicts: []
- name: the node's three versions, newest first, with their parent chain
  request:
    method: GET
    path: "/v1/nodes/00000000-0000-4000-8000-00000000d001/versions"
  expect:
    status: 200
    body:
      versions:
      - created_at:
          "$type": string
        manifest_id:
          "$type": string
        parent_version_id:
          "$type": string
        size: 5
        version_id:
          "$type": string
      - created_at:
          "$type": string
        manifest_id:
          "$type": string
        parent_version_id:
          "$type": string
        size: 5
        version_id:
          "$type": string
      - created_at:
          "$type": string
        manifest_id:
          "$type": string
        parent_version_id:
        size: 5
        version_id:
          "$type": string
- name: restore the node to v1 -- the restored version carries no device
  request:
    method: POST
    path: "/v1/nodes/00000000-0000-4000-8000-00000000d001/restore"
    body:
      version_id: "{{ff_v1_version_id}}"
  expect:
    status: 200
    body:
      seq:
        "$type": integer
      version_id:
        "$type": string
- name: begin v5 based on v3 (current until the restore), device A
  request:
    method: POST
    path: "/v1/commit"
    body:
      commit_id: 00000000-0000-4000-8000-00000000d005
      node_id: 00000000-0000-4000-8000-00000000d001
      parent_node_id:
      name: ff-note.txt
      base_version_id: "{{ff_v3_version_id}}"
      size: 5
      manifest:
      - hash: '0918c5df5294fe51581bad2d6af687cca4172048ae926504f2bf8d9c8b9e717b'
        offset: 0
        length: 5
  expect:
    status: 200
    body:
      commit_id: 00000000-0000-4000-8000-00000000d005
      missing:
      - '0918c5df5294fe51581bad2d6af687cca4172048ae926504f2bf8d9c8b9e717b'
      put_urls:
        '0918c5df5294fe51581bad2d6af687cca4172048ae926504f2bf8d9c8b9e717b':
          "$capture": ff_v5_put_url
- name: upload v5's bytes
  request:
    method: PUT
    path: "{{ff_v5_put_url}}"
    body: ff v5
  expect:
    status: 200
- name: finalize v5 -- a stale base against a device-less current version IS a conflict
  request:
    method: POST
    path: "/v1/commit/00000000-0000-4000-8000-00000000d005/finalize"
  expect:
    status: 200
    body:
      seq:
        "$type": integer
      version_id:
        "$type": string
- name: exactly one open conflict, incoming v5 against the restored current
  request:
    method: GET
    path: "/v1/conflicts"
  expect:
    status: 200
    body:
      conflicts:
      - current:
          created_at:
            "$type": string
          device_name: another device
          size: 5
          version_id:
            "$type": string
        incoming:
          created_at:
            "$type": string
          device_name: device
          size: 5
          version_id:
            "$type": string
        name: ff-note.txt
        node_id:
          "$type": string
- name: resolve it by splitting, with split passed as the STRING "1"
  request:
    method: POST
    path: "/v1/nodes/00000000-0000-4000-8000-00000000d001/resolve_conflict"
    body:
      split: '1'
  expect:
    status: 200
    body:
      seq:
        "$type": integer
      split_node_id:
        "$capture": ff_split_node_id
      split_node_ids:
      - "$ref": ff_split_node_id
- name: no open conflicts remain
  request:
    method: GET
    path: "/v1/conflicts"
  expect:
    status: 200
    body:
      conflicts: []
- name: the original node is still live under its exact name
  request:
    method: GET
    path: "/v1/search"
    query:
      q: ff-note.txt
  expect:
    status: 200
    body:
      results:
      - kind: file
        name: ff-note.txt
        node_id:
          "$type": string
        path: "/ff-note.txt"
        size: 5
